spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=2
            - id: room-service
              uri: lb://room-service
              predicates:
                - Path=/api/rooms/**
              filters:
                - StripPrefix=1
                - JwtAuth
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**
              filters:
                - StripPrefix=1
                - JwtAuth

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: StarlightStaysSuperSecretKeyForJWTSigning1234567890